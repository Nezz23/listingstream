spring.application.name=rentguard
server.port=${PORT:8080}
rentguard.data-dir=${DATA_DIR:data}
rentguard.ledger.key-dir=${LEDGER_KEY_DIR:${rentguard.data-dir}/ledger-keys}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rentguard}
spring.datasource.username=${DATABASE_USER:${USER}}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=rentguard
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=2000
spring.kafka.producer.acks=all
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.linger.ms=20
spring.kafka.producer.batch-size=65536

spring.cache.type=caffeine
spring.cache.cache-names=compliance,trend
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

management.endpoints.web.exposure.include=health,info,metrics
