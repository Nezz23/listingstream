name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 20
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/rentguard_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit + integration tests (embedded Kafka, PostgreSQL) with coverage
        run: mvn -B verify
      - name: Coverage summary
        run: |
          python3 - <<'PY'
          import csv
          rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          covered = sum(int(r["LINE_COVERED"]) for r in rows)
          total = covered + sum(int(r["LINE_MISSED"]) for r in rows)
          print(f"Line coverage: {covered / total:.1%} ({covered}/{total})")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build image
        run: docker build -t chainledger:ci .
