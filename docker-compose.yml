# Kafka (KRaft, no ZooKeeper), PostgreSQL and the stream service.
#   docker compose up --build
#   curl -X POST localhost:8080/api/replay           # streams ./data/listings_*.jsonl.gz
#   curl localhost:8080/api/reconciliation            # compare with the batch warehouse
services:
  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: stream
      POSTGRES_DB: listingstream
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stream"]
      interval: 2s
      retries: 20

  app:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DATABASE_URL: jdbc:postgresql://postgres:5432/listingstream
      DATABASE_USER: stream
      DATABASE_PASSWORD: stream
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    ports: ["8080:8080"]
